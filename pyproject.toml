[project]
name = "secure-banking-rag-gateway"
version = "0.1.0"
description = "Production-grade Hybrid RAG System for Banking77 with Prompt Injection Guards."
authors = [
    {name = "RikiSTM",email = "rikisutiaman@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "polars (>=1.41.2,<2.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "datasets (>=5.0.0,<6.0.0)"
]
